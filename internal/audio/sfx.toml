# The game's sound effects, synthesized at start (synth.go). Each effect is
# a few tones; times are seconds, pitches Hz (A4 = 440). `level` is dB from
# the SFX loudness target, `channel` "ui" plays at once and "jingle" waits
# for the jingle before it. Kept short and low-passed: they play hundreds
# of times a session, beside the player's own thinking.

# ---- verdicts and the boot --------------------------------------------------

[ac]
note = "Accepted: a rising fifth, C6 to G6, with a soft triangle under it."
