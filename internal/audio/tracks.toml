# The music katharsis can download: one [[track]] per file. A track's
# [source.<name>] fills in what the entry leaves out (artist, license,
# page, format). docs/research/audio.md has the licensing evidence, the
# stage-to-pool mapping and how this file was made; nothing here is in
# the repo or the binary but these lines.
#
# Pools are where a track plays (internal/audio/audio.go); keys make a
# track the opening theme of one boss.

[source.tohovgs]
name = "SUZUKI PLAN (Yoji Suzuki): 東方BGM on VGS"
artist = "SUZUKI PLAN"
touhou = true
license = "permission"
license_url = "https://github.com/suzukiplan/tohovgs-cli/blob/cbb13ada5dd1d9244148a265946310bdd192d4b6/README.md#license"
license_quote = """
楽曲（東方 Project）著作権: 楽曲の著作権は上海アリス幻樂団に帰属します
データ著作権: 楽曲データの著作権は Yoji Suzuki に帰属する東方 Project 二次創作物です
本楽曲の東方Projectの二次創作物への利用は [東方Projectの二次創作ガイドライン](https://touhou-project.news/guideline/) で認められている範囲でご自由にお使い頂けます（事前事後の連絡は基本不要ですがご連絡いただければ喜びます）
(The songs are copyright Team Shanghai Alice. The song data is copyright Yoji Suzuki, a Touhou Project fan work. It may be used freely in Touhou Project fan works within what the Touhou Project fan-work guideline allows; no notice is needed before or after, though he is glad to hear from you.)"""
page = "https://github.com/suzukiplan/tohovgs-cli"
url_prefix = "https://raw.githubusercontent.com/suzukiplan/tohovgs-cli/cbb13ada5dd1d9244148a265946310bdd192d4b6/mml/"
format = "mml"
notice = "The songs are VGS MML text, a few kilobytes each, rendered by katharsis as they play. They are fetched from GitHub at commit cbb13ad, never from the 東方BGM on VGS app's own server, which the arranger asks other programs to leave alone."

